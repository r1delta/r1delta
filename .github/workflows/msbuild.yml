name: Build and Release Project

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  SOLUTION_FILE_PATH: Dll1.sln
  BUILD_PATH: ${{ github.workspace }}/build
  OUTPUT_PATH: ${{ github.workspace }}/output
  SYMBOL_PATH: ${{ github.workspace }}/symbols
  CORE_REF: 3375c0cd37857abe4dfe671ffec3faf52d8711cb
  VCPKG_BINARY_SOURCES: "clear;files,D:/a/r1delta/vcpkg,readwrite"
  BUILD_CONFIGURATION: Release
  MSBUILD_DEBUG_TYPE: pdbonly
  NUSPEC_FILE: R1Delta.nuspec
  PACKAGE_NAME: R1Delta
  DISPLAY_VERSION: "3.0 prerelease 4"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025-vs2026
    outputs:
      artifact_name: delta
      symbols_artifact_name: delta-symbols

    steps:
      - name: Checkout R1Delta
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Checkout pinned CORE payload
        uses: actions/checkout@v4
        with:
          repository: r1delta/CORE
          ref: ${{ env.CORE_REF }}
          path: core
          persist-credentials: false

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: script-error-service/package-lock.json

      - name: Prepare clean build directories
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            '${{ env.BUILD_PATH }}',
            '${{ env.OUTPUT_PATH }}',
            '${{ env.SYMBOL_PATH }}'
          )) {
            if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Recurse -Force
            }
            New-Item -ItemType Directory -Path $path | Out-Null
          }

          foreach ($path in @(
            '${{ github.workspace }}/vcpkg/installed',
            '${{ github.workspace }}/vcpkg/packages',
            '${{ github.workspace }}/vcpkg/buildtrees',
            '${{ github.workspace }}/vcpkg/downloads'
          )) {
            New-Item -ItemType Directory -Force -Path $path | Out-Null
          }

      - name: Inject Git tag into compatibility version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag '$tag' is not a machine-readable R1Delta compatibility version (expected vMAJOR.MINOR.PATCH)."
          }

          $header = '${{ github.workspace }}/r1d_version.h'
          $content = Get-Content -LiteralPath $header -Raw
          $displayVersions = [regex]::Matches(
            $content,
            '(?m)^\s*#define\s+R1D_DISPLAY_VERSION\s+"([^"]+)"\s*$'
          )
          if ($displayVersions.Count -ne 1) {
            throw "r1d_version.h contains $($displayVersions.Count) display-version definitions; expected exactly one."
          }
          if ($displayVersions[0].Groups[1].Value -ne '${{ env.DISPLAY_VERSION }}') {
            throw (
              "r1d_version.h display version '$($displayVersions[0].Groups[1].Value)' " +
              "does not match workflow DISPLAY_VERSION '${{ env.DISPLAY_VERSION }}'."
            )
          }

          $updated = $content -replace '#define\s+R1D_VERSION\s+".*"', "#define R1D_VERSION `"$tag`""
          Set-Content -LiteralPath $header -Value $updated

          if (-not (Select-String -LiteralPath $header -Quiet -Pattern (
            '#define\s+R1D_VERSION\s+"' + [regex]::Escape($tag) + '"'
          ))) {
            throw 'The compatibility version was not stamped into r1d_version.h.'
          }
          if (-not $updated.Contains($displayVersions[0].Value)) {
            throw 'The independent display version was changed while stamping the compatibility version.'
          }

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Cache vcpkg build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg/installed
            ${{ github.workspace }}/vcpkg/buildtrees
            ${{ github.workspace }}/vcpkg/downloads
            ${{ github.workspace }}/vcpkg/packages
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('./vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Integrate vcpkg
        shell: pwsh
        run: vcpkg integrate install

      - name: Restore NuGet packages
        shell: pwsh
        run: nuget restore '${{ env.SOLUTION_FILE_PATH }}'

      - name: Rebuild clean Release binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild '${{ env.SOLUTION_FILE_PATH }}' /m /restore /t:Rebuild `
            /p:CI=1 `
            /p:Configuration='${{ env.BUILD_CONFIGURATION }}' `
            /p:Platform=x64 `
            /p:DebugType='${{ env.MSBUILD_DEBUG_TYPE }}' `
            /p:OutDir='${{ env.BUILD_PATH }}/' `
            /p:WarningLevel=0
          if ($LASTEXITCODE -ne 0) {
            throw "Release solution build failed with exit code $LASTEXITCODE."
          }

          # These DLL names intentionally shadow system/vendor modules only inside
          # R1O fake dedicated. Keep them out of bin_delta's root so a normal
          # Titanfall client can never discover them through the ordinary DLL path.
          $stubPath = Join-Path '${{ env.BUILD_PATH }}' 'r1o_stubs'
          New-Item -ItemType Directory -Force -Path $stubPath | Out-Null
          foreach ($fileName in @(
            'd3d11.dll',
            'GFSDK_SSAO.win64.dll',
            'GFSDK_TXAA.win64.dll'
          )) {
            $source = Join-Path '${{ env.BUILD_PATH }}' $fileName
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Release solution build is missing fake-dedi stub $source."
            }
            Move-Item -LiteralPath $source -Destination (Join-Path $stubPath $fileName)
          }

      - name: Build native regression tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $projects = [ordered]@{
            compression_stream_tests = 'tests/compression_stream_tests.vcxproj'
            r1o_vpk_tests = 'tests/r1o_vpk_tests.vcxproj'
            vsdk_memalloc_tests = 'tests/vsdk_memalloc_tests.vcxproj'
            persistentdata_codec_tests = 'tests/persistentdata_codec_tests.vcxproj'
          }

          foreach ($entry in $projects.GetEnumerator()) {
            $outDir = Join-Path '${{ env.BUILD_PATH }}' "tests/$($entry.Key)"
            New-Item -ItemType Directory -Force -Path $outDir | Out-Null
            msbuild $entry.Value /m /restore /t:Rebuild `
              /p:CI=1 `
              /p:Configuration=Release `
              /p:Platform=x64 `
              /p:OutDir="$outDir/"
            if ($LASTEXITCODE -ne 0) {
              throw "$($entry.Key) build failed with exit code $LASTEXITCODE."
            }
          }

      - name: Run native regression tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = @(
            'compression_stream_tests',
            'r1o_vpk_tests',
            'vsdk_memalloc_tests',
            'persistentdata_codec_tests'
          )
          foreach ($test in $tests) {
            $executable = Join-Path '${{ env.BUILD_PATH }}' "tests/$test/$test.exe"
            if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
              throw "Missing native test executable: $executable"
            }
            & $executable
            if ($LASTEXITCODE -ne 0) {
              throw "$test failed with exit code $LASTEXITCODE."
            }
          }

      - name: Install script-error service dependencies
        working-directory: script-error-service
        shell: pwsh
        run: npm ci

      - name: Run script-error service tests
        working-directory: script-error-service
        shell: pwsh
        run: npm test

      - name: Validate clean build and pinned CORE runtime
        shell: pwsh
        run: |
          & '${{ github.workspace }}/ci/verify_release_payload.ps1' `
            -CorePath '${{ github.workspace }}/core' `
            -BuildPath '${{ env.BUILD_PATH }}'

      - name: Prepare release payload and symbols
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outputPath = '${{ env.OUTPUT_PATH }}'
          $deltaPath = Join-Path $outputPath 'r1delta'
          $binDeltaPath = Join-Path $deltaPath 'bin_delta'
          $corePath = '${{ github.workspace }}/core'

          New-Item -ItemType Directory -Force -Path $deltaPath | Out-Null
          robocopy $corePath $deltaPath /E /XD .git .github bin_delta /XF *.md
          $robocopyExitCode = $LASTEXITCODE
          if ($robocopyExitCode -ge 8) {
            throw "CORE copy failed with robocopy exit code $robocopyExitCode."
          }
          $global:LASTEXITCODE = 0

          New-Item -ItemType Directory -Force -Path $binDeltaPath | Out-Null

          foreach ($fileName in @('R1Delta_DS.exe', 'r1delta.exe', 'r1delta.exe.config', 'Titanfall.exe')) {
            $source = Join-Path '${{ env.BUILD_PATH }}' $fileName
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Missing required build output: $source"
            }
            Copy-Item -LiteralPath $source -Destination $outputPath
          }

          $builtDlls = @(Get-ChildItem -LiteralPath '${{ env.BUILD_PATH }}' -File -Filter '*.dll')
          if ($builtDlls.Count -eq 0) {
            throw 'The clean Release build produced no DLLs.'
          }
          $builtDlls | Copy-Item -Destination $binDeltaPath

          $stubSourcePath = Join-Path '${{ env.BUILD_PATH }}' 'r1o_stubs'
          if (-not (Test-Path -LiteralPath $stubSourcePath -PathType Container)) {
            throw 'The R1O fake-dedicated graphics stub directory was not produced.'
          }
          Copy-Item -LiteralPath $stubSourcePath -Destination $binDeltaPath -Recurse

          Get-ChildItem -LiteralPath '${{ env.BUILD_PATH }}' -File -Filter '*.png' |
            Copy-Item -Destination $binDeltaPath

          $toolsPath = Join-Path '${{ env.BUILD_PATH }}' 'tools'
          if (-not (Test-Path -LiteralPath $toolsPath -PathType Container)) {
            throw 'The launcher tools directory was not produced.'
          }
          Copy-Item -LiteralPath $toolsPath -Destination $outputPath -Recurse
          Copy-Item -LiteralPath '${{ github.workspace }}/${{ env.NUSPEC_FILE }}' -Destination $outputPath

          $pdbFiles = @(Get-ChildItem -LiteralPath '${{ env.BUILD_PATH }}' -File -Filter '*.pdb')
          if ($pdbFiles.Count -eq 0) {
            throw 'The clean Release build produced no PDB files.'
          }
          $pdbFiles | Copy-Item -Destination '${{ env.SYMBOL_PATH }}'

      - name: Validate final release payload
        shell: pwsh
        run: |
          & '${{ github.workspace }}/ci/verify_release_payload.ps1' `
            -CorePath '${{ github.workspace }}/core' `
            -BuildPath '${{ env.BUILD_PATH }}' `
            -PayloadPath '${{ env.OUTPUT_PATH }}'

      - name: Upload release payload
        uses: actions/upload-artifact@v4
        with:
          name: delta
          path: ${{ env.OUTPUT_PATH }}
          if-no-files-found: error

      - name: Upload private symbols
        uses: actions/upload-artifact@v4
        with:
          name: delta-symbols
          path: ${{ env.SYMBOL_PATH }}
          if-no-files-found: error

  release:
    permissions: write-all
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    steps:
      - name: Download release payload
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ github.workspace }}/release_package

      - name: Download symbols
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.symbols_artifact_name }}
          path: ${{ github.workspace }}/symbols

      - name: Setup NuGet CLI
        uses: NuGet/setup-nuget@v2
        with:
          nuget-version: latest

      - name: Install Squirrel.Windows tool
        id: install_squirrel
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $toolRoot = '${{ github.workspace }}/squirrel-tool'
          New-Item -ItemType Directory -Force -Path $toolRoot | Out-Null
          nuget install Clowd.Squirrel -OutputDirectory $toolRoot -ExcludeVersion -NoCache -DirectDownload

          $squirrel = Get-ChildItem -LiteralPath $toolRoot -Recurse -File -Filter Squirrel.exe |
            Select-Object -First 1
          if (-not $squirrel) {
            throw 'Could not locate Squirrel.exe after NuGet installation.'
          }
          $squirrel.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Get version from tag
        id: get_version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build Squirrel release
        shell: pwsh
        working-directory: ${{ github.workspace }}/release_package
        run: |
          $ErrorActionPreference = 'Stop'
          $nugetOutput = '${{ github.workspace }}/nuget_output'
          $squirrelOutput = '${{ github.workspace }}/squirrel_release'
          New-Item -ItemType Directory -Force -Path $nugetOutput, $squirrelOutput | Out-Null

          if (-not (Test-Path -LiteralPath '${{ env.NUSPEC_FILE }}' -PathType Leaf)) {
            throw 'Release payload does not contain the NuSpec file.'
          }
          nuget pack '${{ env.NUSPEC_FILE }}' `
            -Version '${{ steps.get_version.outputs.version }}' `
            -OutputDirectory $nugetOutput `
            -NoPackageAnalysis
          if ($LASTEXITCODE -ne 0) {
            throw "NuGet pack failed with exit code $LASTEXITCODE."
          }

          $package = Join-Path $nugetOutput '${{ env.PACKAGE_NAME }}.${{ steps.get_version.outputs.version }}.nupkg'
          if (-not (Test-Path -LiteralPath $package -PathType Leaf)) {
            throw "NuGet package was not produced: $package"
          }
          Squirrel releasify --package $package --releaseDir $squirrelOutput
          if ($LASTEXITCODE -ne 0) {
            throw "Squirrel releasify failed with exit code $LASTEXITCODE."
          }

      - name: Find release assets
        id: find_assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = '${{ github.workspace }}/squirrel_release'
          $setup = Get-ChildItem -LiteralPath $releaseDir -File -Filter '*Setup.exe' | Select-Object -First 1
          $fullPackage = Get-ChildItem -LiteralPath $releaseDir -File -Filter '*-full.nupkg' | Select-Object -First 1
          $releases = Join-Path $releaseDir 'RELEASES'
          if (-not $setup -or -not $fullPackage -or -not (Test-Path -LiteralPath $releases -PathType Leaf)) {
            throw 'Squirrel did not produce Setup.exe, RELEASES, and a full package.'
          }

          $symbolsZip = Join-Path '${{ github.workspace }}' (
            'R1Delta-${{ steps.get_version.outputs.version }}-symbols.zip'
          )
          Compress-Archive -Path '${{ github.workspace }}/symbols/*' -DestinationPath $symbolsZip -Force

          "setup_path=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "setup_name=$($setup.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "releases_path=$releases" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "package_path=$($fullPackage.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "package_name=$($fullPackage.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "symbols_path=$symbolsZip" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "symbols_name=$([System.IO.Path]::GetFileName($symbolsZip))" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create GitHub release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: R1Delta ${{ env.DISPLAY_VERSION }}
          draft: false
          # Squirrel has no update channels in R1Delta. This must remain a
          # normal release so existing clients consume its RELEASES index.
          prerelease: false

      - name: Upload Setup executable
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.find_assets.outputs.setup_path }}
          asset_name: ${{ steps.find_assets.outputs.setup_name }}
          asset_content_type: application/vnd.microsoft.portable-executable

      - name: Upload RELEASES index
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.find_assets.outputs.releases_path }}
          asset_name: RELEASES
          asset_content_type: text/plain

      - name: Upload full package
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.find_assets.outputs.package_path }}
          asset_name: ${{ steps.find_assets.outputs.package_name }}
          asset_content_type: application/zip

      - name: Upload symbols
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.find_assets.outputs.symbols_path }}
          asset_name: ${{ steps.find_assets.outputs.symbols_name }}
          asset_content_type: application/zip
