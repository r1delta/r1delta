[package]
name = "r1delta_iroh"
version = "0.1.0"
edition = "2021"
publish = false
description = "iroh overlay transport plugin for R1Delta (see ../r1p_plugin.h)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
iroh = "1.3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
